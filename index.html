<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktywny Plan Lokalu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased h-screen flex flex-col">
    <!-- Navbar -->
    <header class="bg-white shadow w-full z-50">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center">
                    <span class="text-xl font-bold text-blue-600">Menedżer Planu</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow flex overflow-hidden">
        <!-- Sidebar for tools -->
        <aside class="w-64 bg-white border-r shadow-sm flex flex-col">
            <div class="p-4 border-b">
                <h2 class="text-lg font-semibold text-gray-700">Meble i Obiekty</h2>
                <p class="text-sm text-gray-500 mt-1">Kliknij, aby dodać na plan</p>
            </div>
            <div class="p-4 flex-grow overflow-y-auto space-y-4">
                <button onclick="addFurniture('Regał', 'shelf-style')" class="w-full text-left px-4 py-2 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded border border-amber-300 transition-colors">
                    + Dodaj Regał
                </button>
                <button onclick="addFurniture('Stół', 'table-style')" class="w-full text-left px-4 py-2 bg-blue-100 hover:bg-blue-200 text-blue-900 rounded border border-blue-300 transition-colors">
                    + Dodaj Stół
                </button>
                <button onclick="addFurniture('Krzesło', 'chair-style')" class="w-full text-left px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-900 rounded border border-gray-300 transition-colors">
                    + Dodaj Krzesło
                </button>

                <div class="mt-8 pt-4 border-t border-gray-200">
                    <p class="text-xs text-gray-500 mb-2">Wskazówka: Przeciągnij elementy aby je przemieścić. Zaznacz element i wciśnij klawisz Delete aby go usunąć.</p>
                </div>
            </div>
        </aside>

        <!-- Main Plan Area -->
        <section class="flex-grow bg-gray-100 p-8 overflow-auto relative flex justify-center items-center">
            <div id="plan-container" class="shadow-xl bg-white">
                <img src="plan.jpg" alt="Plan lokalu" class="max-w-full h-auto max-h-[80vh] pointer-events-none">
                <!-- Objects will be dynamically added here -->
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
