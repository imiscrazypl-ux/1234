<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktywny Plan Lokalu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased h-screen flex flex-col">
    <!-- Navbar -->
    <header class="bg-white shadow w-full z-50">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center">
                    <span class="text-xl font-bold text-blue-600">Menedżer Planu</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow flex overflow-hidden">
        <!-- Sidebar for tools -->
        <aside class="w-80 bg-white border-r shadow-sm flex flex-col z-20">
            <div class="p-4 border-b flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-semibold text-gray-700">Narzędzia</h2>
                    <p class="text-sm text-gray-500 mt-1">Zarządzaj planem</p>
                </div>
            </div>

            <div class="p-4 flex-grow overflow-y-auto space-y-6">
                <!-- Project Management -->
                <div>
                    <h3 class="text-sm font-bold text-gray-700 mb-3 uppercase">Zarządzaj Projektem</h3>
                    <div class="flex space-x-2">
                        <button onclick="saveProject()" class="flex-1 px-2 py-2 bg-purple-100 hover:bg-purple-200 text-purple-900 text-xs rounded border border-purple-300 transition-colors">
                            Zapisz Projekt
                        </button>
                        <button onclick="loadProject()" class="flex-1 px-2 py-2 bg-indigo-100 hover:bg-indigo-200 text-indigo-900 text-xs rounded border border-indigo-300 transition-colors">
                            Wczytaj Projekt
                        </button>
                    </div>
                    <button onclick="clearProject()" class="w-full mt-2 px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs rounded border border-gray-300 transition-colors">
                        Wyczyść Cały Plan
                    </button>
                </div>

                <!-- Add items section -->
                <div>
                    <h3 class="text-sm font-bold text-gray-700 mb-3 uppercase">Dodaj gotowe</h3>
                    <div class="space-y-2">
                        <button onclick="addFurniture('Regał', '#8b4513', '14%', '4%', '4px')" class="w-full text-left px-4 py-2 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded border border-amber-300 transition-colors">
                            + Dodaj Regał
                        </button>
                        <button onclick="addFurniture('Stół', '#3b82f6', '10%', '10%', '50%')" class="w-full text-left px-4 py-2 bg-blue-100 hover:bg-blue-200 text-blue-900 rounded border border-blue-300 transition-colors">
                            + Dodaj Stół
                        </button>
                        <button onclick="addFurniture('Krzesło', '#6b7280', '4%', '4%', '50%')" class="w-full text-left px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-900 rounded border border-gray-300 transition-colors">
                            + Dodaj Krzesło
                        </button>
                    </div>
                </div>

                <div>
                    <h3 class="text-sm font-bold text-gray-700 mb-3 uppercase">Narzędzia Specjalne</h3>
                    <div class="space-y-2">
                        <button onclick="addEraser()" class="w-full text-left px-4 py-2 bg-gray-50 hover:bg-gray-100 text-gray-800 rounded border border-gray-300 transition-colors border-dashed">
                            + Maska (Gumka na obraz)
                        </button>
                        <button onclick="addFurniture('Nowy Obiekt', '#10b981', '8%', '8%', '4px')" class="w-full text-center px-4 py-3 bg-green-500 hover:bg-green-600 text-white font-bold rounded shadow transition-colors">
                            + Dodaj Własny Obiekt
                        </button>
                    </div>
                </div>

                <!-- Edit item section -->
                <div id="editor-panel" class="hidden border-t pt-4">
                    <h3 class="text-sm font-bold text-blue-600 mb-3 uppercase">Edycja obiektu</h3>

                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Nazwa</label>
                            <input type="text" id="edit-name" class="w-full border p-2 rounded text-sm">
                        </div>

                        <div class="flex space-x-2">
                            <div class="w-1/2">
                                <label class="block text-xs text-gray-500 mb-1">Kolor Tła</label>
                                <input type="color" id="edit-color" class="w-full h-8 p-0 border-0 rounded cursor-pointer">
                            </div>
                            <div class="w-1/2">
                                <label class="block text-xs text-gray-500 mb-1">Obrót (Stopnie)</label>
                                <input type="number" id="edit-rotation" class="w-full border p-1.5 rounded text-sm" value="0">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Obrazek Tła (URL)</label>
                            <input type="text" id="edit-bg-image" class="w-full border p-2 rounded text-sm" placeholder="https://...">
                        </div>

                        <div class="flex space-x-2">
                            <div class="w-1/2">
                                <label class="block text-xs text-gray-500 mb-1">Szerokość</label>
                                <input type="text" id="edit-width" class="w-full border p-2 rounded text-sm" placeholder="np. 10%">
                            </div>
                            <div class="w-1/2">
                                <label class="block text-xs text-gray-500 mb-1">Wysokość</label>
                                <input type="text" id="edit-height" class="w-full border p-2 rounded text-sm" placeholder="np. 10%">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Kształt</label>
                            <select id="edit-shape" class="w-full border p-2 rounded text-sm">
                                <option value="0px">Ostre kąty</option>
                                <option value="4px">Zaokrąglony (4px)</option>
                                <option value="12px">Mocno zaokrąglony (12px)</option>
                                <option value="50%">Koło/Owal (50%)</option>
                            </select>
                        </div>

                        <button onclick="deleteSelected()" class="w-full mt-4 text-center px-4 py-2 bg-red-100 hover:bg-red-200 text-red-700 font-bold rounded border border-red-300 transition-colors">
                            Usuń obiekt
                        </button>
                    </div>
                </div>

                <div class="mt-8 pt-4 border-t border-gray-200">
                    <p class="text-xs text-gray-500 mb-2">Wskazówka: Przeciągnij elementy aby je przemieścić. Kliknij obiekt, aby go edytować.</p>
                </div>
            </div>
        </aside>

        <!-- Main Plan Area -->
        <section class="flex-grow bg-gray-100 p-8 overflow-auto relative flex justify-center items-center">
            <div id="plan-container" class="shadow-xl bg-white">
                <img src="plan.jpg" alt="Plan lokalu" class="max-w-full h-auto max-h-[80vh] pointer-events-none">
                <!-- Objects will be dynamically added here -->
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
